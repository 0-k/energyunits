[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "energyunits"
dynamic = ["version"]
authors = [
  { name = "Martin Klein", email = "hi@martinklein.co" },
]
description = "Units, conversions and calculations for energy system modeling: fuels, emissions, costs, inflation and exchange rates."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "energy",
  "units",
  "unit conversion",
  "energy system modeling",
  "techno-economic analysis",
  "emissions",
  "heating value",
  "inflation",
]
dependencies = [
  "numpy>=1.22",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
docs = [
  "sphinx>=7.0",
  "furo",
  "myst-parser",
]
dev = [
  "energyunits[pandas,test]",
  "black>=24.3",
  "isort>=5.12",
  "flake8>=6.0",
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/0-k/energyunits"
Documentation = "https://energyunits.readthedocs.io/"
"Bug Tracker" = "https://github.com/0-k/energyunits/issues"
"Source Code" = "https://github.com/0-k/energyunits"
Changelog = "https://github.com/0-k/energyunits/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "energyunits.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["energyunits*"]

[tool.setuptools.package-data]
energyunits = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 110
