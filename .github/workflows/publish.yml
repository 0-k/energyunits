name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches the package version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('energyunits/__init__.py').read()).group(1))")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match package version 'v${VERSION}'"
            exit 1
          fi

      - name: Install and test
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[pandas,test]"
          python -m pytest -q

      - name: Build package
        run: |
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/energyunits

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
